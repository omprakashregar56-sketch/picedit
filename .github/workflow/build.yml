name: Build EXE
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt pyinstaller
      - run: pyinstaller --onefile --noconsole --name OM_Picture_Manager --icon assets/icon.ico --add-data "assets;assets" main.py
      - uses: actions/upload-artifact@v4
        with:
          name: OM_Picture_Manager-windows
          path: |
            dist/OM_Picture_Manager.exe
            config.json
